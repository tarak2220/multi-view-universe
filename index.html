```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi View Universe</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:20px;background:#191e2b}
h1{color:#65d7ff;margin:0 0 8px}
.layout{display:flex;gap:20px;padding:20px;max-width:1500px;margin:auto}
.viewer{flex:1;min-width:0;min-height:70vh;display:flex;align-items:center;justify-content:center;background:#080a10;border-radius:12px;padding:10px}
#exhibitImage{max-width:100%;max-height:75vh;object-fit:contain}
.controls{width:230px;flex-shrink:0;background:#191e2b;padding:16px;border-radius:12px}
button{width:100%;padding:12px;margin:5px 0;border:1px solid #3b4b65;border-radius:7px;background:#252e40;color:white;cursor:pointer;font-size:15px}
button:hover,button.active{background:#087ea4}
#status{color:#9ee9ff;font-size:14px}
@media(max-width:700px){.layout{flex-direction:column}.viewer,.controls{width:100%;min-height:40vh}.controls button{width:48%}}
</style>
</head>
<body>
<header>
<h1>Multi View Universe</h1>
<p>Interactive Exhibit Display System</p>
</header>
<main class="layout">
<section class="viewer">
<img id="exhibitImage" src="./Multi%20View%20Universe%20Exhibit.png" alt="Exhibit image">
</section>
<aside class="controls">
<h2>Exhibit Controls</h2>
<button data-view="0" class="active">Welcome</button>
<button data-view="1">View 1</button>
<button data-view="2">View 2</button>
<button data-view="3">View 3</button>
<button data-view="4">View 4</button>
<button data-view="5">View 5</button>
<button data-view="6">View 6</button>
<button data-view="restart">Restart</button>
<p id="status">Welcome screen</p>
</aside>
</main>
<script>
const img=document.getElementById("exhibitImage");
const status=document.getElementById("status");
const buttons=document.querySelectorAll("[data-view]");
function showView(v){
if(v==="restart"||v==="0"){
v="0";
img.src="./Multi%20View%20Universe%20Exhibit.png";
status.textContent="Welcome screen";
}else{
img.src="./multi%20view%20universe/"+v+".jpg";
status.textContent="Displaying View "+v;
}
buttons.forEach(b=>b.classList.toggle("active",b.dataset.view===v));
}
img.onerror=()=>{status.textContent="Image not found. Check the image files in GitHub."};
buttons.forEach(b=>b.addEventListener("click",()=>showView(b.dataset.view)));
document.addEventListener("keydown",e=>{
if(/^[0-6]$/.test(e.key))showView(e.key);
if(e.key.toLowerCase()==="r")showView("restart");
});
</script>
</body>
</html>
```
