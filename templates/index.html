
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Multi View Universe</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px 18px 18px;
      background: radial-gradient(
        ellipse at top,
        #1a2450,
        #070916 70%
      );
      color: #f5f7ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin: 4px 0;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
    }

    .subtitle {
      color: #bac7ff;
      margin: 0 0 4px;
    }

    #status {
      min-height: 1.3em;
      margin: 4px 0;
      color: #d2d9ff;
    }

    /* Exhibit image area on the left */
    .viewer {
      height: calc(100vh - 112px);
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 225px 0 0;
    }

    #exhibit {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 12px 42px #0008;
    }

    /* Options centered vertically on the right side */
    .controls {
      position: fixed;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);

      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;

      width: 180px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 12px;

      border: 1px solid #6575d8;
      border-radius: 14px;
      background: #0b1230ef;
      box-shadow: 0 8px 30px #0007;

      z-index: 1000;
    }

    button {
      width: 100%;
      flex-shrink: 0;
      border: 1px solid #7585ff;
      border-radius: 9px;
      padding: 11px 12px;
      color: white;
      background: #3444a6;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover,
    button:focus-visible {
      background: #5367e8;
      outline: 2px solid #c5ccff;
    }

    button.active {
      background: #aab5ff;
      color: #0b102c;
      font-weight: 700;
    }

    button.restart {
      background: #8b2635;
      border-color: #ff9ca8;
    }

    button.restart:hover {
      background: #b93648;
    }

    .hint {
      position: fixed;
      right: 18px;
      bottom: 5px;
      color: #9da9d6;
      font-size: 0.75rem;
      width: 180px;
      z-index: 1001;
    }

    /* Layout for mobile and narrow screens */
    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      .viewer {
        height: 58vh;
        min-height: 260px;
        margin: 0;
      }

      .controls {
        position: static;
        transform: none;
        width: 100%;
        max-height: none;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        margin: 10px auto;
      }

      button {
        width: auto;
        flex: 1 1 80px;
      }

      .hint {
        position: static;
        transform: none;
        width: auto;
        margin: 8px auto;
      }
    }
  </style>
</head>

<body>

  <h1>Multi View Universe</h1>

  <p class="subtitle">
    Explore the exhibit from six views
  </p>

  <p id="status" role="status">
    Welcome screen
  </p>

  <!-- Main exhibit image -->
  <main class="viewer">
    <img
      id="exhibit"
      src="/welcome"
      alt="Multi View Universe welcome image"
    >
  </main>

  <!-- Right-side options -->
  <nav class="controls" aria-label="Exhibit options">

    <button
      id="welcome-button"
      onclick="selectView(0)"
    >
      Welcome
    </button>

    <button data-view="1" onclick="selectView(1)">
      View 1
    </button>

    <button data-view="2" onclick="selectView(2)">
      View 2
    </button>

    <button data-view="3" onclick="selectView(3)">
      View 3
    </button>

    <button data-view="4" onclick="selectView(4)">
      View 4
    </button>

    <button data-view="5" onclick="selectView(5)">
      View 5
    </button>

    <button data-view="6" onclick="selectView(6)">
      View 6
    </button>

    <button
      class="restart"
      onclick="selectView(0)"
    >
      Restart
    </button>

  </nav>

  <p class="hint">
    Press the physical buttons :1–8
  </p>

  <script>
    let currentView = -1;

    const image = document.getElementById("exhibit");
    const statusText = document.getElementById("status");

    // Highlight the currently selected option.
    function updateActiveButton(view) {
      document.querySelectorAll("[data-view]").forEach(button => {
        button.classList.toggle(
          "active",
          Number(button.dataset.view) === view
        );
      });

      document
        .getElementById("welcome-button")
        .classList.toggle("active", view === 0);
    }

    // Display the selected image.
    function renderView(view, force = false) {
      if (!Number.isInteger(view) || view < 0 || view > 6) {
        return;
      }

      if (!force && view === currentView) {
        return;
      }

      currentView = view;

      const timestamp = Date.now();

      const src = view === 0
        ? "/welcome?t=" + timestamp
        : "/image/" + view + "?t=" + timestamp;

      image.src = src;

      image.alt = view === 0
        ? "Multi View Universe welcome image"
        : "Multi View Universe view " + view;

      statusText.textContent = view === 0
        ? "Welcome screen"
        : "View " + view + " of 6";

      updateActiveButton(view);
    }

    // Website controls update the display and backend state.
    async function selectView(view) {
      renderView(view, true);

      try {
        await fetch("/api/select/" + view, {
          method: "POST"
        });
      } catch (error) {
        console.error("Could not update backend view:", error);
      }
    }

    // Read physical button selections when running on a Raspberry Pi.
    async function pollHardwareButtons() {
      try {
        const response = await fetch("/api/current-view", {
          cache: "no-store"
        });

        if (!response.ok) {
          return;
        }

        const data = await response.json();

        if (data.gpio_available) {
          if (!document.body.dataset.gpioMessageShown) {
            document.body.dataset.gpioMessageShown = "1";
            statusText.textContent =
              "Hardware buttons connected";
          }

          if (data.view !== currentView) {
            renderView(data.view);
          }
        }
      } catch (error) {
        // Keep the website responsive if polling fails.
      }
    }

    // Report missing image files.
    image.addEventListener("error", () => {
      statusText.textContent =
        "Image could not be loaded. Check the image filename and folder.";
    });

    // Keyboard controls: 0 = Welcome, 1-6 = views, R = Restart.
    document.addEventListener("keydown", event => {
      if (
        event.target &&
        ["INPUT", "TEXTAREA"].includes(event.target.tagName)
      ) {
        return;
      }

      if (/^[0-6]$/.test(event.key)) {
        selectView(Number(event.key));
      } else if (event.key === "r" || event.key === "R") {
        selectView(0);
      }
    });

    // Start on the Welcome image.
    renderView(0, true);

    // Check for Raspberry Pi button changes four times per second.
    window.setInterval(pollHardwareButtons, 250);
  </script>

</body>
</html>
